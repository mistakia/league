# sops/age recipient policy for league config secrets.
#
# Three encrypted files, three DELIBERATELY DIFFERENT recipient sets:
#
#   external-league-credentials-key.sops.json  the AES-256-GCM column key for
#     external_league_connections.credentials_encrypted (users' third-party
#     fantasy-platform logins). Narrowest set: the single host running the
#     encrypt/decrypt site.
#   league-globals.sql  the PLAINTEXT input to scripts/postgres-globals-backup.sh;
#     carries an ALTER ROLE password for every login role on the cluster. Narrower
#     than the config set.
#   config/config-production.json  the production app secrets. Widest set: every
#     host that loads config/index.mjs under NODE_ENV=production.
#
# The three path_regex values are mutually DISJOINT -- no path matches more than
# one -- so rule ORDER enforces nothing here. The regexes are what separate the
# sets; do not rely on position when editing.
#
# Values below are age PUBLIC keys and are safe to commit. Each host's private
# identity exists only on that host at ~/.config/sops/age/keys.txt.
#
# Editing:
#   re-encrypt after a change   sops config/config-production.json
#   add a host                  add its recipient here, then
#                               sops updatekeys config/config-production.json
#
# `sops updatekeys` re-keys the FILES named by a creation_rule only. It cannot
# re-key a league-globals.sops.sql backup that has already been produced and
# pulled, because sops matches creation_rules on ENCRYPT and that output is never
# re-encrypted in place. Rotating an identity therefore orphans existing backup
# artifacts until the backup script is rerun and the copies re-pulled.
#
# WHICH recipient belongs to WHICH host, what each host may and may not decrypt,
# and why the sets differ are recorded privately in the knowledge base at
# user:text/league/league-sops-recipient-topology.md -- this repository is public
# and must not publish the decrypt topology. Keep that document in step with
# every recipient change made here.
#
# Only the production config is sops/age-migrated. config-development.json and
# config-test.json are read plaintext off disk (config/index.mjs); they are
# committed to a PUBLIC repo and must contain placeholders only, never a real
# credential and never a value shared with production. Both are intentionally
# unmatched here.
creation_rules:
  - path_regex: (^|/)external-league-credentials-key\.sops\.json$
    age: age1ajtjq48cp44328um33x0hgwm4f8s9wcs5kaa092mdruncc875seqcspgwt
  - path_regex: (^|/)league-globals\.sql$
    age: age1ajtjq48cp44328um33x0hgwm4f8s9wcs5kaa092mdruncc875seqcspgwt,age1nvpxn4r70h90wvgh6vgr3r0hwej33p6qjtdkgthanlvtle8hpdssqdm4j0
  - path_regex: (^|/)config/config-production\.json$
    age: age1ajtjq48cp44328um33x0hgwm4f8s9wcs5kaa092mdruncc875seqcspgwt,age1y2v9qgpd7sxctst6mly7ztqnv3wrgrqw9wx7dsrldvxk8eer2u7s4zae7m,age1gmhatmnl7f28yz4nhz6y527uxzrelg39s05ex2tvyfsumr45tvss40nm4a,age1nvpxn4r70h90wvgh6vgr3r0hwej33p6qjtdkgthanlvtle8hpdssqdm4j0
