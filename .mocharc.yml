# Mocha's 2000ms default is sized for pure unit tests. Most of this suite is
# integration tests that seed and query a real Postgres over TCP, so a test doing
# nothing unusual can sit close to that budget and then cross it whenever CI's
# runner is loaded. That is what made CI fail on a different spec each run while
# the same commit passed locally -- the failures were runner speed, not the code
# under test. Individual specs had been raising `this.timeout(60 * 1000)` on
# their heavier hooks one at a time; this sets a floor for the whole suite so the
# workaround does not have to be rediscovered per spec.
#
# This is headroom for legitimately DB-bound work, not cover for slow fixtures:
# 10s still fails a genuine hang quickly, and `test/global.mjs` now prints any
# unhandled rejection so a swallowed Postgres error surfaces as itself rather
# than as a timeout.
timeout: 10000

# Every spec lives FLAT in test/, named test/<area>.<name>.spec.mjs, because
# mocha's default spec glob (./test/*.{js,cjs,mjs}) is one level deep. A spec in
# a subdirectory is silently not a test: 13 files and 205 tests sat uncollected
# under test/libs-shared/, test/libs-server/, test/data-view-storage/ and
# test/data-views/ until 2026-08-03, two of them failing the whole time.
# `yarn check:test-collection` now fails on any test file mocha does not collect.
#
# Do NOT add a `spec` key here to widen collection. Mocha MERGES rc `spec` into
# the command line's positional arguments rather than being overridden by them
# (lib/cli/options.js recombines `args.spec` into `args._`), so a `spec` glob
# would silently widen every script that passes its own path -- `test:private`
# and `test:data-view-queries` would each pull in the entire main suite.
# Overlapping globs also double-collect: 'test/*.mjs' plus 'test/**/*.spec.mjs'
# resolves to 376 files, 196 unique, running most specs twice. Both measured
# against mocha 11.0.1.
#
# `ignore` is safe here -- it is the rc spelling of the CLI's `--exclude`, and
# it stays exclusionary under a positional argument instead of widening it.
# This file is excluded from `yarn test` and CI on purpose: it hits the live
# ESPN API.
#
# An entry naming a file that does not exist excludes NOTHING while reading as a
# deliberate exclusion. A second entry here did exactly that from 2025-06-11
# (d468e3ca8) until 2026-08-05: it named
# test/libs-server.get-players-table-view-results-debug.mjs, which has never
# existed at any revision -- the files in that family were
# get-players-table-view-results{,-2,-3}.mjs, and all three are now gone.
# `yarn check:test-collection` now fails on a literal `ignore` entry with no
# file behind it, so this cannot recur silently.
ignore:
  - 'test/importer-espn.spec.mjs'
  # Fetches the live Sleeper and ESPN APIs. These two tests sat inside
  # test/external-fantasy-leagues-canonical-format-adapters.spec.mjs behind an
  # env-gated `this.skip()`, which made the release gate report two pending
  # tests forever; they were split into their own file on 2026-08-09 so that
  # file's 16 offline fixture tests stay in CI. `yarn test:external-league-live`
  # runs them.
  - 'test/external-fantasy-leagues-live-vendor-contract.spec.mjs'
