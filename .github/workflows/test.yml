name: Test

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: league_test
          POSTGRES_PASSWORD: league_test
          POSTGRES_DB: league_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Clean install
        run: |
          rm -rf node_modules
          yarn install --immutable

      # Fails when a test file under test/ is not collected by mocha. Runs
      # before the database setup so an uncollected spec fails in seconds
      # rather than after a full suite that silently skipped it.
      - name: Test collection guard
        run: yarn check:test-collection

      # Fails when a floating surface sets a global-layer z-index as a bare
      # number instead of taking it from the scale in app/styles/variables.styl.
      # Runs here for the same reason as the guard above — it is a static read
      # and answers in under a second.
      - name: z-index scale guard
        run: yarn check:z-index-scale

      # Fails when a table-qualified column literal in server code does not
      # resolve against db/schema.postgres.sql. GATE 1 ONLY, deliberately: it
      # needs no rename list and no base ref, so it cannot drift and cannot go
      # red on a sibling's in-flight migration. Static read, no database.
      #
      # Gate 2 is NOT wired and must not be until it can see `year`. It diffs
      # the schema against a base ref, which makes it depend on which ref CI
      # picks, and its findings need per-site adjudication by someone who knows
      # the cluster. Run it by hand per rename cluster:
      #   node db/gates/check-renamed-column-consumers.mjs --gate 2 \
      #     --base <pre-cluster-ref> --unadjudicated
      - name: Renamed-column consumer gate (gate 1)
        run: node db/gates/check-renamed-column-consumers.mjs --gate 1

      # The companion to the gate above, covering the references that name no
      # table LITERALLY: an alias-qualified 'r.year' bound by a join, and an
      # unqualified object key like .where({ lid, year }). Both were invisible to
      # every gate until 2026-08-07, which is how the season_grain conform left
      # rosters_players.year live in compute-roster-slot-metrics (37cc9f36b) and
      # three more 42703s on master besides.
      #
      # CI-eligible on exactly gate 1's terms: it resolves against the current
      # schema, so it needs no rename list and no base ref, cannot drift, and
      # cannot go red on a sibling's in-flight migration. Static read, no
      # database. Its six negative controls run on every invocation, and four of
      # them are what proves the scan is not vacuous -- each has to find real
      # corpus material of its shape before it can mutate it, so all four go red
      # when the walk reaches nothing. That is why this gate asserts no coverage
      # floor: the numbers a floor would guard are already guarded, and coverage
      # is instead asserted per corpus root, where the controls are blind.
      - name: Knex column resolution gate
        run: node db/gates/check-knex-column-resolution.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup PostgreSQL roles
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: league_test
          PGUSER: league_test
          PGPASSWORD: league_test
        run: |
          # Create the roles db/schema.postgres.sql GRANTs to (postgres,
          # league_user, league_readonly) using the same canonical, idempotent
          # init script compose.test.yaml mounts locally — the inline version
          # below only created postgres, so the schema's 315 GRANTs to
          # league_readonly aborted the load with "role does not exist".
          psql -v ON_ERROR_STOP=1 -f db/test/init-roles.sql
          # Ensure league_test role has necessary permissions
          psql -c "GRANT ALL PRIVILEGES ON DATABASE league_test TO league_test;" || true

      - name: Schema conformance ratchet
        run: node db/gates/check-schema-conformance-ratchet.mjs

      - name: yarn test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: league_test
          PGUSER: league_test
          PGPASSWORD: league_test
        run: |
          yarn lint
          yarn test

# Failing beacuse virtual framebuffer not installed
#          yarn build-e2e
#          yarn test-e2e
