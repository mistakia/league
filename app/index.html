    <!-- Font.
         ONE stylesheet rather than hand-pasted @font-face rules, because the
         hand-pasted set had gone stale in the way that is invisible: it loaded
         Inter 400 and IBM Plex Mono 300/400 and nothing else, while the app
         asks for 500, 600 and 700 in 147 places. Every one of those was drawn
         by the browser SYNTHESIZING a bold from the 400 face — a smeared,
         evenly-thickened letterform that is the single loudest thing telling a
         reader a page was not typeset. Weights here must cover what the
         stylesheets ask for; a missing one does not fail, it fauxes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- No `maximum-scale`: it disables pinch zoom, which is the one recourse
         a reader has on a phone when a measure or a control is too small. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
